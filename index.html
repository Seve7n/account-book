<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>我的记账本</title>
<style>
  :root {
    --bg-color: #f0f2f5;
    --bg-gradient: linear-gradient(160deg, #f2f5fa 0%, #e8edf5 100%);
    --card-bg: #ffffff;
    --text-main: #333333;
    --text-sub: #888888;
    --border-color: #e4e7ed;
    --primary-color: #4a7fe0;
    --primary-hover: #3a6bc9;
    --income-color: #1a9e5c;
    --income-bg: rgba(26, 158, 92, 0.08);
    --expense-color: #e04a4a;
    --expense-bg: rgba(224, 74, 74, 0.08);
    --shadow: 0 4px 16px rgba(31, 45, 61, 0.06);
    --radius: 14px;
  }

  body.dark-mode {
    --bg-color: #1a1a2e;
    --bg-gradient: linear-gradient(160deg, #141426 0%, #1a1a2e 100%);
    --card-bg: #16213e;
    --text-main: #e4e4e4;
    --text-sub: #9aa0a6;
    --border-color: #2a3a5a;
    --primary-color: #5b8cff;
    --primary-hover: #4a7fe0;
    --income-bg: rgba(26, 158, 92, 0.15);
    --expense-bg: rgba(224, 74, 74, 0.15);
    --shadow: 0 4px 16px rgba(0, 0, 0, 0.35);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; transition: background-color 0.3s, color 0.3s, border-color 0.3s; }

  body {
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    background: var(--bg-gradient);
    background-attachment: fixed;
    color: var(--text-main);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  .navbar {
    width: 100%;
    height: 60px;
    background: var(--card-bg);
    box-shadow: var(--shadow);
    display: flex;
    justify-content: center;
    position: sticky;
    top: 0;
    z-index: 100;
  }
  .nav-content {
    width: 100%;
    max-width: 680px;
    padding: 0 20px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .nav-title { font-size: 18px; font-weight: 600; display: flex; align-items: center; gap: 8px; }
  .btn-icon {
    background: none; border: none; font-size: 20px; cursor: pointer;
    color: var(--text-main); padding: 5px; border-radius: 50%;
    transition: transform 0.2s, background-color 0.3s;
  }
  .btn-icon:hover { background: var(--border-color); transform: rotate(15deg); }

  .app {
    width: 100%;
    max-width: 680px;
    padding: 20px;
    margin: 0 auto;
  }

  .stats { display: flex; gap: 12px; margin-bottom: 16px; }
  .stat-card {
    flex: 1; background: var(--card-bg); border-radius: var(--radius);
    padding: 16px 12px; text-align: center; box-shadow: var(--shadow);
    position: relative; overflow: hidden;
  }
  .stat-card::before {
    content: ""; position: absolute; top: 0; left: 0; right: 0; height: 3px;
  }
  .stat-card.card-income::before { background: linear-gradient(90deg, #1a9e5c, #27c07a); }
  .stat-card.card-expense::before { background: linear-gradient(90deg, #e04a4a, #f07070); }
  .stat-card.card-balance::before  { background: linear-gradient(90deg, #4a7fe0, #6a9cf0); }
  .stat-card .label { font-size: 13px; color: var(--text-sub); margin-bottom: 6px; }
  .stat-card .value { font-size: 20px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .income-text { color: var(--income-color) !important; }
  .expense-text { color: var(--expense-color) !important; }

  .form {
    background: var(--card-bg); border-radius: var(--radius); padding: 20px;
    margin-bottom: 16px; box-shadow: var(--shadow);
  }
  .form-row { display: flex; gap: 10px; margin-bottom: 12px; }
  .form-row:last-child { margin-bottom: 0; }

  .type-switch { display: flex; gap: 10px; width: 100%; background: var(--bg-color); padding: 4px; border-radius: 10px;}
  .type-btn {
    flex: 1; padding: 8px; border: none; background: transparent;
    border-radius: 8px; cursor: pointer; font-size: 14px; color: var(--text-sub);
    font-weight: 500; transition: background-color 0.2s, color 0.2s;
  }
  .type-btn.active-expense { background: var(--expense-color); color: #fff; }
  .type-btn.active-income { background: var(--income-color); color: #fff; }

  input, select {
    padding: 10px 12px; border: 1px solid var(--border-color); border-radius: 10px;
    font-size: 14px; outline: none; width: 100%; font-family: inherit;
    background: var(--card-bg); color: var(--text-main);
  }
  input:focus, select:focus { border-color: var(--primary-color); box-shadow: 0 0 0 3px rgba(74, 127, 224, 0.15); }

  .btn-add {
    width: 100%; padding: 12px; border: none; border-radius: 10px;
    background: linear-gradient(135deg, var(--primary-color), var(--primary-hover));
    color: #fff; font-size: 15px; cursor: pointer; font-weight: 600; letter-spacing: 1px;
    box-shadow: 0 4px 12px rgba(74, 127, 224, 0.3);
    transition: transform 0.15s, box-shadow 0.2s, filter 0.2s;
  }
  .btn-add:hover { transform: translateY(-1px); box-shadow: 0 6px 16px rgba(74, 127, 224, 0.4); filter: brightness(1.05); }
  .btn-add:active { transform: translateY(1px); box-shadow: 0 2px 6px rgba(74, 127, 224, 0.3); }

  /* ===== 预算卡片 ===== */
  .budget-card {
    background: var(--card-bg); border-radius: var(--radius); padding: 16px 20px;
    margin-bottom: 16px; box-shadow: var(--shadow);
  }
  .budget-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; flex-wrap: wrap; gap: 8px; }
  .budget-head .budget-title { font-size: 14px; font-weight: 600; }
  .budget-input-group { display: flex; align-items: center; gap: 8px; }
  .budget-input-group input { width: 110px; padding: 6px 10px; font-size: 13px; }
  .btn-budget {
    border: none; border-radius: 8px; padding: 6px 14px; font-size: 13px; font-weight: 500;
    background: var(--primary-color); color: #fff; cursor: pointer;
  }
  .btn-budget:hover { background: var(--primary-hover); }
  .budget-track { height: 10px; background: var(--bg-color); border-radius: 5px; overflow: hidden; }
  .budget-fill {
    height: 100%; border-radius: 5px; width: 0%;
    background: linear-gradient(90deg, var(--primary-color), #6a9cf0);
    transition: width 0.5s ease, background 0.3s;
  }
  .budget-fill.warn  { background: linear-gradient(90deg, #f0a020, #f5c060); }
  .budget-fill.over  { background: linear-gradient(90deg, #e04a4a, #f07070); }
  .budget-text { font-size: 12px; color: var(--text-sub); margin-top: 8px; }

  .toolbar {
    display: flex; justify-content: space-between; align-items: center;
    margin-bottom: 15px; flex-wrap: wrap; gap: 10px;
  }
  .search-box { flex: 1; min-width: 150px; position: relative; }
  .search-box input { padding-left: 32px; }
  .search-box::before {
    content: "🔍"; position: absolute; left: 10px; top: 50%; transform: translateY(-50%);
    font-size: 12px; opacity: 0.5; z-index: 1;
  }
  .filter-box { display: flex; align-items: center; gap: 8px; }
  .filter-box input { width: 140px; }
  .btn-text {
    background: none; border: none; color: var(--primary-color);
    cursor: pointer; font-size: 13px; font-weight: 500; padding: 4px 6px;
    border-radius: 6px; transition: background-color 0.2s;
  }
  .btn-text:hover { text-decoration: underline; background: rgba(74, 127, 224, 0.08); }
  .btn-danger { color: var(--expense-color); }

  .list { background: var(--card-bg); border-radius: var(--radius); overflow: hidden; box-shadow: var(--shadow); }
  .record {
    display: flex; align-items: center; padding: 14px 16px;
    border-bottom: 1px solid var(--border-color);
    transition: background-color 0.15s;
  }
  .record:last-child { border-bottom: none; }
  .record:hover { background: var(--bg-color); }
  .record-info { flex: 1; min-width: 0; }
  .record-top { display: flex; align-items: center; gap: 8px; margin-bottom: 4px; }
  .record-category {
    flex-shrink: 0; font-size: 12px; background: rgba(74, 127, 224, 0.1); color: var(--primary-color);
    padding: 2px 8px; border-radius: 4px; font-weight: 500;
  }
  .record-note {
    font-size: 14px; color: var(--text-main); overflow: hidden;
    text-overflow: ellipsis; white-space: nowrap; flex: 1; min-width: 0;
  }
  .record-date { font-size: 12px; color: var(--text-sub); }
  .record-amount { font-size: 16px; font-weight: 700; margin: 0 12px; flex-shrink: 0; font-variant-numeric: tabular-nums; }
  .btn-del {
    border: none; background: none; color: var(--text-sub); cursor: pointer;
    font-size: 16px; padding: 6px; border-radius: 50%; flex-shrink: 0;
    transition: color 0.2s, background-color 0.2s, transform 0.2s;
  }
  .btn-del:hover { color: var(--expense-color); background: var(--expense-bg); transform: scale(1.1); }

  .empty { text-align: center; color: var(--text-sub); padding: 40px 20px; font-size: 14px; }

  /* ===== 图表与排行区（grid 布局，含联动占比图+趋势图+排行） ===== */
  .panel-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
    gap: 16px;
    margin-top: 20px;
  }
  .panel-box {
    background: var(--card-bg); border-radius: var(--radius); padding: 18px;
    box-shadow: var(--shadow);
  }
  .panel-box h2 { font-size: 15px; margin-bottom: 4px; color: var(--text-main); font-weight: 600; }
  .panel-box .panel-sub { font-size: 12px; color: var(--text-sub); margin-bottom: 12px; }
  .chart-wrap { position: relative; height: 230px; width: 100%; }

  .chart-empty {
    position: absolute; inset: 0;
    display: none; align-items: center; justify-content: center; flex-direction: column; gap: 6px;
    color: var(--text-sub); font-size: 13px; text-align: center; pointer-events: none;
  }
  .chart-empty .empty-icon { font-size: 26px; opacity: 0.5; }

  /* ===== 分类排行 ===== */
  .rank-item { margin-bottom: 12px; }
  .rank-item:last-child { margin-bottom: 0; }
  .rank-line { display: flex; justify-content: space-between; font-size: 13px; margin-bottom: 5px; }
  .rank-name { display: flex; align-items: center; gap: 6px; font-weight: 500; }
  .rank-badge {
    display: inline-flex; align-items: center; justify-content: center;
    width: 18px; height: 18px; border-radius: 50%;
    font-size: 11px; color: #fff; flex-shrink: 0;
  }
  .rank-line .rank-val { color: var(--text-sub); font-variant-numeric: tabular-nums; }
  .rank-track { height: 8px; background: var(--bg-color); border-radius: 4px; overflow: hidden; }
  .rank-fill { height: 100%; border-radius: 4px; transition: width 0.5s ease; }

  .data-manage {
    display: flex; justify-content: center; gap: 20px; margin-top: 30px; margin-bottom: 20px;
    flex-wrap: wrap;
  }
</style>
</head>
<body>

  <div class="navbar">
    <div class="nav-content">
      <div class="nav-title">💰 我的账本</div>
      <button class="btn-icon" id="btnTheme" title="切换深色模式">🌙</button>
    </div>
  </div>

  <div class="app">
    <div class="stats">
      <div class="stat-card card-income">
        <div class="label">总收入</div>
        <div class="value income-text" id="totalIncome">¥0.00</div>
      </div>
      <div class="stat-card card-expense">
        <div class="label">总支出</div>
        <div class="value expense-text" id="totalExpense">¥0.00</div>
      </div>
      <div class="stat-card card-balance">
        <div class="label">结余</div>
        <div class="value" id="balance">¥0.00</div>
      </div>
    </div>

    <div class="form">
      <div class="form-row">
        <div class="type-switch">
          <button class="type-btn active-expense" data-type="expense">支出</button>
          <button class="type-btn" data-type="income">收入</button>
        </div>
      </div>
      <div class="form-row">
        <input type="number" id="amount" placeholder="金额 (元)" min="0" step="0.01">
        <select id="category"></select>
      </div>
      <div class="form-row">
        <input type="date" id="date">
        <input type="text" id="note" placeholder="备注（选填）">
      </div>
      <div class="form-row">
        <button class="btn-add" id="btnAdd">确认添加</button>
      </div>
    </div>

    <!-- 预算卡片 -->
    <div class="budget-card">
      <div class="budget-head">
        <span class="budget-title">🎯 本月预算</span>
        <div class="budget-input-group">
          <input type="number" id="budgetInput" placeholder="设置预算 (元)" min="0" step="0.01">
          <button class="btn-budget" id="btnBudget">保存</button>
        </div>
      </div>
      <div class="budget-track"><div class="budget-fill" id="budgetFill"></div></div>
      <div class="budget-text" id="budgetText">尚未设置预算</div>
    </div>

    <div class="toolbar">
      <div class="search-box">
        <input type="text" id="searchInput" placeholder="搜索备注或分类...">
      </div>
      <div class="filter-box">
        <input type="month" id="monthFilter">
        <button class="btn-text" id="btnClearFilter">清除</button>
      </div>
    </div>

    <div class="list" id="list"></div>

    <!-- 新版：联动占比图 + 趋势图 + 分类排行 -->
    <div class="panel-grid">
      <div class="panel-box">
        <h2 id="typeChartTitle">📊 支出分类占比</h2>
        <div class="panel-sub" id="typeChartSub">—</div>
        <div class="chart-wrap">
          <canvas id="typeChart"></canvas>
          <div class="chart-empty" id="typeChartEmpty">
            <div class="empty-icon">🈳</div>
            <div id="typeChartEmptyText">暂无支出数据</div>
          </div>
        </div>
      </div>
      <div class="panel-box">
        <h2>📈 近 6 个月收支趋势</h2>
        <div class="panel-sub">绿色为收入，红色为支出</div>
        <div class="chart-wrap">
          <canvas id="trendChart"></canvas>
          <div class="chart-empty" id="trendEmpty">
            <div class="empty-icon">🈳</div>
            <div>暂无趋势数据</div>
          </div>
        </div>
      </div>
      <div class="panel-box">
        <h2 id="rankTitle">🏆 支出分类排行</h2>
        <div class="panel-sub" id="rankSub">—</div>
        <div id="rankList"></div>
      </div>
    </div>

    <div class="data-manage">
      <button class="btn-text" id="btnExport">📤 导出数据</button>
      <button class="btn-text" id="btnImport">📥 导入数据</button>
      <input type="file" id="fileInput" style="display: none;" accept=".json">
      <button class="btn-text btn-danger" id="btnClearAll">🗑️ 清空所有数据</button>
    </div>
  </div>

<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<script>
const CATEGORIES = {
  expense: ['餐饮', '交通', '购物', '娱乐', '学习', '医疗', '其他'],
  income:  ['工资', '兼职', '理财', '红包', '其他']
};
const STORAGE_KEY = 'my_fancy_records';
const THEME_KEY = 'my_fancy_theme';
const BUDGET_KEY = 'my_fancy_budget'; 

const EXPENSE_COLORS = ['#e04a4a', '#f0a020', '#d9534f', '#f0ad4e', '#c9302c', '#ec971f', '#b85450', '#e67e22', '#c0392b', '#f39c12'];
const INCOME_COLORS  = ['#1a9e5c', '#4a7fe0', '#16a085', '#2980b9', '#27ae60', '#3498db', '#1abc9c', '#2ecc71', '#2c8ecf', '#00b894'];
const RANK_BADGE_COLORS = ['#e67e22', '#95a5a6', '#c08457', '#b0b8c4', '#b0b8c4']; // 金 银 铜 …

let records = loadRecords();
let currentType = 'expense';
let typeChartObj = null;   // 单个联动占比图
let trendChartObj = null;  // 趋势图
let isDarkMode = false;

function loadRecords() {
  try { return JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]'); } catch (e) { return []; }
}
function saveRecords() { localStorage.setItem(STORAGE_KEY, JSON.stringify(records)); }

// toISOString 使用 UTC，某些时区会差一天，改用本地日期
function todayStr() {
  const d = new Date();
  const p = n => String(n).padStart(2, '0');
  return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())}`;
}
function currentMonth() { return todayStr().slice(0, 7); }

const $amount = document.getElementById('amount');
const $category = document.getElementById('category');
const $date = document.getElementById('date');
const $note = document.getElementById('note');
const $list = document.getElementById('list');
const $monthFilter = document.getElementById('monthFilter');
const $searchInput = document.getElementById('searchInput');
const $totalIncome = document.getElementById('totalIncome');
const $totalExpense = document.getElementById('totalExpense');
const $balance = document.getElementById('balance');
const $budgetInput = document.getElementById('budgetInput');
const $budgetFill = document.getElementById('budgetFill');
const $budgetText = document.getElementById('budgetText');
const $rankList = document.getElementById('rankList');
const typeBtns = document.querySelectorAll('.type-btn');

function init() {
  $date.value = todayStr();
  $budgetInput.value = localStorage.getItem(BUDGET_KEY) || '';

  if (localStorage.getItem(THEME_KEY) === 'dark') {
    isDarkMode = true;
    document.body.classList.add('dark-mode');
    document.getElementById('btnTheme').textContent = '☀️';
  }

  switchType('expense');
  render();

  document.getElementById('btnAdd').addEventListener('click', addRecord);
  typeBtns.forEach(btn => btn.addEventListener('click', () => switchType(btn.dataset.type)));
  $amount.addEventListener('keydown', e => { if (e.key === 'Enter') addRecord(); });

  $monthFilter.addEventListener('change', render);
  $searchInput.addEventListener('input', render);
  document.getElementById('btnClearFilter').addEventListener('click', () => {
    $monthFilter.value = ''; $searchInput.value = ''; render();
  });

  document.getElementById('btnBudget').addEventListener('click', saveBudget);
  $budgetInput.addEventListener('keydown', e => { if (e.key === 'Enter') saveBudget(); });

  document.getElementById('btnTheme').addEventListener('click', toggleTheme);

  document.getElementById('btnExport').addEventListener('click', exportData);
  document.getElementById('btnImport').addEventListener('click', () => document.getElementById('fileInput').click());
  document.getElementById('fileInput').addEventListener('change', importData);
  document.getElementById('btnClearAll').addEventListener('click', clearAllData);
}

// 切换支出/收入时，同步刷新占比图和分类排行（联动核心）
function switchType(type) {
  currentType = type;
  typeBtns.forEach(btn => {
    btn.classList.remove('active-expense', 'active-income');
    if (btn.dataset.type === type) btn.classList.add(type === 'expense' ? 'active-expense' : 'active-income');
  });
  $category.innerHTML = CATEGORIES[currentType].map(c => `<option value="${escapeHtml(c)}">${escapeHtml(c)}</option>`).join('');
  renderTypeChart(getFilteredRecords());
  renderRanking(getFilteredRecords());
}

function addRecord() {
  const amount = parseFloat($amount.value);
  if (!amount || isNaN(amount) || amount <= 0) {
    alert('请输入有效的金额（大于0）');
    $amount.focus(); return;
  }
  records.push({
    id: Date.now(),
    type: currentType,
    amount: Math.round(amount * 100) / 100,
    category: $category.value,
    note: $note.value.trim(),
    date: $date.value || todayStr()
  });
  saveRecords();
  $amount.value = ''; $note.value = ''; $amount.focus();
  render();
}

function deleteRecord(id) {
  if (!confirm('确定删除这条记录吗？')) return;
  records = records.filter(r => r.id !== id);
  saveRecords(); render();
}

function clearAllData() {
  if (records.length === 0) return alert('当前没有数据');
  if (!confirm('🚨 警告：确定要清空所有记账数据吗？此操作无法撤销！')) return;
  records = [];
  saveRecords(); render();
}

// 保存预算
function saveBudget() {
  const val = parseFloat($budgetInput.value);
  if (isNaN(val) || val < 0) return alert('请输入有效的预算金额');
  localStorage.setItem(BUDGET_KEY, String(val));
  renderBudget();
}

function getFilteredRecords() {
  let filtered = records;
  const month = $monthFilter.value;
  const keyword = $searchInput.value.trim().toLowerCase();

  if (month) filtered = filtered.filter(r => r.date.startsWith(month));
  if (keyword) {
    filtered = filtered.filter(r =>
      r.note.toLowerCase().includes(keyword) ||
      r.category.toLowerCase().includes(keyword)
    );
  }
  return filtered;
}

function getCategoryStats(list, type) {
  const filteredList = list.filter(r => r.type === type);
  const map = {};
  filteredList.forEach(r => { map[r.category] = (map[r.category] || 0) + r.amount; });
  const entries = Object.entries(map).sort((a, b) => b[1] - a[1]); // 按金额降序
  const total = entries.reduce((s, e) => s + e[1], 0);
  return { labels: entries.map(e => e[0]), data: entries.map(e => e[1]), total };
}

function render() {
  const filtered = getFilteredRecords();
  renderStats(filtered);
  renderList(filtered);
  renderBudget();
  renderTypeChart(filtered);
  renderRanking(filtered);
  renderTrend();
}

function renderStats(list) {
  const income = list.filter(r => r.type === 'income').reduce((s, r) => s + r.amount, 0);
  const expense = list.filter(r => r.type === 'expense').reduce((s, r) => s + r.amount, 0);
  const balance = income - expense;

  $totalIncome.textContent = '¥' + income.toFixed(2);
  $totalExpense.textContent = '¥' + expense.toFixed(2);
  $balance.textContent = '¥' + balance.toFixed(2);
  $balance.className = 'value ' + (balance >= 0 ? 'income-text' : 'expense-text');
}

// 预算进度条渲染
function renderBudget() {
  const budget = parseFloat(localStorage.getItem(BUDGET_KEY)) || 0;
  const month = $monthFilter.value || currentMonth();
  const spent = records
    .filter(r => r.type === 'expense' && r.date.startsWith(month))
    .reduce((s, r) => s + r.amount, 0);

  if (budget <= 0) {
    $budgetFill.style.width = '0%';
    $budgetFill.className = 'budget-fill';
    $budgetText.textContent = '尚未设置预算，设置后可监控本月支出';
    return;
  }
  const pct = Math.min(spent / budget * 100, 100);
  const remain = budget - spent;
  $budgetFill.style.width = pct + '%';
  $budgetFill.className = 'budget-fill' + (spent > budget ? ' over' : (spent >= budget * 0.8 ? ' warn' : ''));
  const monthName = month === currentMonth() ? '本月' : month;
  $budgetText.textContent = spent > budget
    ? `⚠️ ${monthName}已超支 ¥${(spent - budget).toFixed(2)}（已用 ¥${spent.toFixed(2)} / 预算 ¥${budget.toFixed(2)}）`
    : `${monthName}已用 ¥${spent.toFixed(2)} / 预算 ¥${budget.toFixed(2)}，剩余 ¥${remain.toFixed(2)}（${pct.toFixed(0)}%）`;
}

function renderList(list) {
  if (list.length === 0) {
    $list.innerHTML = '<div class="empty">没有找到符合条件的记录～</div>';
    return;
  }
  const sorted = [...list].sort((a, b) => b.date.localeCompare(a.date) || b.id - a.id);
  $list.innerHTML = sorted.map(r => {
    const sign = r.type === 'income' ? '+' : '-';
    const cls = r.type === 'income' ? 'income-text' : 'expense-text';
    return `
      <div class="record">
        <div class="record-info">
          <div class="record-top">
            <span class="record-category">${escapeHtml(r.category)}</span>
            ${r.note ? `<span class="record-note">${escapeHtml(r.note)}</span>` : '<span class="record-note" style="color:#aaa;font-style:italic;">无备注</span>'}
          </div>
          <div class="record-date">${escapeHtml(r.date)}</div>
        </div>
        <div class="record-amount ${cls}">${sign}¥${r.amount.toFixed(2)}</div>
        <button class="btn-del" data-id="${r.id}" title="删除">✕</button>
      </div>
    `;
  }).join('');

  $list.querySelectorAll('.btn-del').forEach(btn => {
    btn.addEventListener('click', () => deleteRecord(Number(btn.dataset.id)));
  });
}

/* ======= 占比图跟随"支出/收入"切换按钮联动 ======= */
function renderTypeChart(list) {
  const isDark = document.body.classList.contains('dark-mode');
  const textColor = isDark ? '#e4e4e4' : '#555';
  const stats = getCategoryStats(list, currentType);
  const colors = currentType === 'expense' ? EXPENSE_COLORS : INCOME_COLORS;
  const typeText = currentType === 'expense' ? '支出' : '收入';

  document.getElementById('typeChartTitle').textContent = currentType === 'expense' ? '📊 支出分类占比' : '📊 收入分类占比';
  document.getElementById('rankTitle').textContent = currentType === 'expense' ? '🏆 支出分类排行' : '🏆 收入分类排行';
  document.getElementById('typeChartEmptyText').textContent = `暂无${typeText}数据`;

  if (typeChartObj) typeChartObj.destroy();
  const canvas = document.getElementById('typeChart');
  const $empty = document.getElementById('typeChartEmpty');
  const $sub = document.getElementById('typeChartSub');

  if (stats.labels.length === 0) {
    $empty.style.display = 'flex';
    canvas.style.display = 'none';
    $sub.textContent = '—';
    return;
  }
  $empty.style.display = 'none';
  canvas.style.display = 'block';
  $sub.textContent = `共 ${stats.labels.length} 个分类 · 合计 ¥${stats.total.toFixed(2)}`;

  typeChartObj = new Chart(canvas.getContext('2d'), {
    type: 'doughnut',
    data: {
      labels: stats.labels,
      datasets: [{ data: stats.data, backgroundColor: colors, borderWidth: 2, borderColor: isDark ? '#16213e' : '#ffffff', hoverOffset: 6 }]
    },
    options: {
      responsive: true, maintainAspectRatio: false, cutout: '62%',
      animation: { duration: 500 },
      plugins: {
        legend: { position: 'bottom', labels: { color: textColor, boxWidth: 10, boxHeight: 10, padding: 8, font: { size: 11 } } },
        tooltip: {
          callbacks: {
            label: (ctx) => {
              const pct = stats.total > 0 ? (ctx.parsed / stats.total * 100).toFixed(1) : 0;
              return ` ${ctx.label}: ¥${ctx.parsed.toFixed(2)}（${pct}%）`;
            }
          }
        }
      }
    }
  });
}

/* ======= 分类排行（进度条形式，与占比图联动） ======= */
function renderRanking(list) {
  const stats = getCategoryStats(list, currentType);
  const $sub = document.getElementById('rankSub');
  const isIncome = currentType === 'income';
  const color = isIncome ? '#1a9e5c' : '#e04a4a';

  if (stats.labels.length === 0) {
    $sub.textContent = '—';
    $rankList.innerHTML = '<div class="empty">暂无数据</div>';
    return;
  }
  $sub.textContent = `按金额从高到低 · 合计 ¥${stats.total.toFixed(2)}`;
  const max = stats.data[0] || 1;

  $rankList.innerHTML = stats.labels.map((label, i) => {
    const val = stats.data[i];
    const pct = stats.total > 0 ? (val / stats.total * 100).toFixed(1) : 0;
    const badge = i < 3 ? `<span class="rank-badge" style="background:${RANK_BADGE_COLORS[i]}">${i + 1}</span>` : `<span class="rank-badge" style="background:#b0b8c4">${i + 1}</span>`;
    return `
      <div class="rank-item">
        <div class="rank-line">
          <span class="rank-name">${badge}${escapeHtml(label)}</span>
          <span class="rank-val">¥${val.toFixed(2)} · ${pct}%</span>
        </div>
        <div class="rank-track">
          <div class="rank-fill" style="width:${(val / max * 100).toFixed(1)}%;background:${color};opacity:${1 - i * 0.12}"></div>
        </div>
      </div>
    `;
  }).join('');
}

/* ======= 近 6 个月收支趋势柱状图 ======= */
function renderTrend() {
  const isDark = document.body.classList.contains('dark-mode');
  const textColor = isDark ? '#e4e4e4' : '#555';
  const gridColor = isDark ? 'rgba(255,255,255,0.08)' : 'rgba(0,0,0,0.06)';

  const months = [];
  const now = new Date();
  for (let i = 5; i >= 0; i--) {
    const d = new Date(now.getFullYear(), now.getMonth() - i, 1);
    months.push(`${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}`);
  }
  const incomeData = months.map(m =>
    records.filter(r => r.type === 'income' && r.date.startsWith(m)).reduce((s, r) => s + r.amount, 0)
  );
  const expenseData = months.map(m =>
    records.filter(r => r.type === 'expense' && r.date.startsWith(m)).reduce((s, r) => s + r.amount, 0)
  );

  if (trendChartObj) trendChartObj.destroy();
  const canvas = document.getElementById('trendChart');
  const $empty = document.getElementById('trendEmpty');
  const hasData = incomeData.some(v => v > 0) || expenseData.some(v => v > 0);

  if (!hasData) {
    $empty.style.display = 'flex';
    canvas.style.display = 'none';
    return;
  }
  $empty.style.display = 'none';
  canvas.style.display = 'block';

  trendChartObj = new Chart(canvas.getContext('2d'), {
    type: 'bar',
    data: {
      labels: months.map(m => m.slice(5) + '月'),
      datasets: [
        { label: '收入', data: incomeData, backgroundColor: '#1a9e5c', borderRadius: 4, maxBarThickness: 26 },
        { label: '支出', data: expenseData, backgroundColor: '#e04a4a', borderRadius: 4, maxBarThickness: 26 }
      ]
    },
    options: {
      responsive: true, maintainAspectRatio: false,
      animation: { duration: 500 },
      scales: {
        x: { ticks: { color: textColor, font: { size: 11 } }, grid: { display: false } },
        y: { ticks: { color: textColor, font: { size: 11 } }, grid: { color: gridColor }, beginAtZero: true }
      },
      plugins: {
        legend: { position: 'bottom', labels: { color: textColor, boxWidth: 10, boxHeight: 10, padding: 8, font: { size: 11 } } },
        tooltip: { callbacks: { label: (ctx) => ` ${ctx.dataset.label}: ¥${ctx.parsed.y.toFixed(2)}` } }
      }
    }
  });
}

function toggleTheme() {
  isDarkMode = !isDarkMode;
  document.body.classList.toggle('dark-mode', isDarkMode);
  document.getElementById('btnTheme').textContent = isDarkMode ? '☀️' : '🌙';
  localStorage.setItem(THEME_KEY, isDarkMode ? 'dark' : 'light');
  const filtered = getFilteredRecords();
  renderTypeChart(filtered);
  renderTrend();
}

function exportData() {
  if (records.length === 0) return alert('当前没有数据可导出');
  const blob = new Blob([JSON.stringify(records, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = `记账数据_${todayStr()}.json`;
  a.click(); URL.revokeObjectURL(url);
}

function importData(e) {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = (event) => {
    try {
      const data = JSON.parse(event.target.result);
      if (Array.isArray(data)) {
        if (confirm('导入会覆盖当前所有数据，确定吗？')) {
          records = data; saveRecords(); render(); alert('数据导入成功！');
        }
      } else alert('文件格式不正确');
    } catch (err) { alert('读取失败，请确保是有效的 JSON 文件'); }
    e.target.value = '';
  };
  reader.readAsText(file);
}

function escapeHtml(str) {
  return String(str).replace(/[&<>"']/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[m]));
}

init();
</script>
