<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>记账小工具</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  
  /* 👇 关键修改：强制让整个页面居中，排除左右并列的可能 */
  body {
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    background: #f5f6f8;
    color: #333;
    padding: 20px;
    display: flex;
    justify-content: center; /* 强制水平居中 */
    align-items: flex-start;
    min-height: 100vh;
  }
  
  .app { width: 100%; max-width: 520px; margin: 0 auto; } /* margin auto 双保险 */

  h1 { font-size: 20px; margin-bottom: 16px; text-align: center; }

  /* 统计卡片 */
  .stats { display: flex; gap: 10px; margin-bottom: 16px; }
  .stat-card {
    flex: 1; background: #fff; border-radius: 10px;
    padding: 12px; text-align: center;
    box-shadow: 0 1px 4px rgba(0,0,0,.06);
  }
  .stat-card .label { font-size: 12px; color: #888; margin-bottom: 4px; }
  .stat-card .value { font-size: 16px; font-weight: 600; }
  .income-text { color: #1a9e5c; }
  .expense-text { color: #e04a4a; }

  /* 表单 */
  .form {
    background: #fff; border-radius: 10px; padding: 14px;
    margin-bottom: 16px; box-shadow: 0 1px 4px rgba(0,0,0,.06);
  }
  .form-row { display: flex; gap: 8px; margin-bottom: 10px; }
  .form-row:last-child { margin-bottom: 0; }
  .type-switch { display: flex; gap: 8px; width: 100%; }
  .type-btn {
    flex: 1; padding: 8px; border: 1px solid #ddd; background: #fff;
    border-radius: 8px; cursor: pointer; font-size: 14px; color: #666;
    transition: all .15s;
  }
  .type-btn.active-expense { background: #e04a4a; border-color: #e04a4a; color: #fff; }
  .type-btn.active-income { background: #1a9e5c; border-color: #1a9e5c; color: #fff; }

  input, select {
    padding: 8px 10px; border: 1px solid #ddd; border-radius: 8px;
    font-size: 14px; outline: none; width: 100%;
    font-family: inherit;
  }
  input:focus, select:focus { border-color: #4a7fe0; }

  .btn-add {
    width: 100%; padding: 10px; border: none; border-radius: 8px;
    background: #4a7fe0; color: #fff; font-size: 15px;
    cursor: pointer; font-weight: 500;
  }
  .btn-add:hover { background: #3a6bc9; }

  /* 筛选 */
  .filter-row {
    display: flex; align-items: center; gap: 8px; margin-bottom: 10px;
  }
  .filter-row label { font-size: 13px; color: #666; white-space: nowrap; }

  /* 列表 */
  .list { background: #fff; border-radius: 10px; overflow: hidden;
    box-shadow: 0 1px 4px rgba(0,0,0,.06); }
  .record {
    display: flex; align-items: center; padding: 12px 14px;
    border-bottom: 1px solid #f0f0f0;
  }
  .record:last-child { border-bottom: none; }
  .record-info { flex: 1; min-width: 0; }
  .record-top { display: flex; align-items: center; gap: 8px; margin-bottom: 3px; }
  .record-category {
    font-size: 13px; background: #eef2fb; color: #4a7fe0;
    padding: 1px 8px; border-radius: 10px;
  }
  .record-note {
    font-size: 13px; color: #999; overflow: hidden;
    text-overflow: ellipsis; white-space: nowrap;
  }
  .record-date { font-size: 12px; color: #bbb; margin-top: 2px; }
  .record-amount { font-size: 15px; font-weight: 600; margin: 0 10px; }
  .btn-del {
    border: none; background: none; color: #ccc; cursor: pointer;
    font-size: 18px; padding: 4px; line-height: 1;
  }
  .btn-del:hover { color: #e04a4a; }

  .empty { text-align: center; color: #bbb; padding: 30px; font-size: 14px; }

  /* 图表 */
  .chart-box {
    background: #fff; border-radius: 10px; padding: 14px;
    margin-top: 16px; box-shadow: 0 1px 4px rgba(0,0,0,.06);
  }
  .chart-box h2 { font-size: 14px; margin-bottom: 10px; color: #666; }
  .chart-wrap { position: relative; height: 200px; }
</style>
</head>
<body>
<div class="app">
  <h1>💰 记账小工具</h1>

  <!-- 统计卡片 -->
  <div class="stats">
    <div class="stat-card">
      <div class="label">总收入</div>
      <div class="value income-text" id="totalIncome">¥0.00</div>
    </div>
    <div class="stat-card">
      <div class="label">总支出</div>
      <div class="value expense-text" id="totalExpense">¥0.00</div>
    </div>
    <div class="stat-card">
      <div class="label">结余</div>
      <div class="value" id="balance">¥0.00</div>
    </div>
  </div>

  <!-- 表单 -->
  <div class="form">
    <div class="form-row">
      <div class="type-switch">
        <button class="type-btn active-expense" data-type="expense">支出</button>
        <button class="type-btn" data-type="income">收入</button>
      </div>
    </div>
    <div class="form-row">
      <input type="number" id="amount" placeholder="金额" min="0" step="0.01">
      <select id="category"></select>
    </div>
    <div class="form-row">
      <input type="date" id="date">
      <input type="text" id="note" placeholder="备注（选填）">
    </div>
    <div class="form-row">
      <button class="btn-add" id="btnAdd">添加记录</button>
    </div>
  </div>

  <!-- 筛选 -->
  <div class="filter-row">
    <label>筛选月份：</label>
    <input type="month" id="monthFilter">
    <button class="btn-del" id="btnClearFilter" title="清除筛选" style="font-size:13px;color:#4a7fe0;">清除</button>
  </div>

  <!-- 列表 -->
  <div class="list" id="list"></div>

  <!-- 图表 -->
  <div class="chart-box">
    <h2>支出分类占比</h2>
    <div class="chart-wrap">
      <canvas id="pieChart"></canvas>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<script>
/* ============ 配置 ============ */
const CATEGORIES = {
  expense: ['餐饮', '交通', '购物', '娱乐', '学习', '其他'],
  income:  ['工资', '兼职', '红包', '其他']
};
const STORAGE_KEY = 'records';

/* ============ 状态 ============ */
let records = loadRecords();
let currentType = 'expense';
let pieChart = null;

/* ============ 数据层 ============ */
function loadRecords() {
  try {
    return JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');
  } catch (e) {
    return [];
  }
}
function saveRecords() {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(records));
}

/* ============ DOM 引用 ============ */
const $amount = document.getElementById('amount');
const $category = document.getElementById('category');
const $date = document.getElementById('date');
const $note = document.getElementById('note');
const $list = document.getElementById('list');
const $monthFilter = document.getElementById('monthFilter');
const $totalIncome = document.getElementById('totalIncome');
const $totalExpense = document.getElementById('totalExpense');
const $balance = document.getElementById('balance');
const typeBtns = document.querySelectorAll('.type-btn');

/* ============ 初始化 ============ */
function init() {
  $date.value = new Date().toISOString().slice(0, 10);
  switchType('expense');
  renderCategoryOptions();
  render();

  document.getElementById('btnAdd').addEventListener('click', addRecord);
  typeBtns.forEach(btn => {
    btn.addEventListener('click', () => switchType(btn.dataset.type));
  });
  $monthFilter.addEventListener('change', render);
  document.getElementById('btnClearFilter').addEventListener('click', () => {
    $monthFilter.value = '';
    render();
  });
  $amount.addEventListener('keydown', e => {
    if (e.key === 'Enter') addRecord();
  });
}

function switchType(type) {
  currentType = type;
  typeBtns.forEach(btn => {
    btn.classList.remove('active-expense', 'active-income');
    if (btn.dataset.type === type) {
      btn.classList.add(type === 'expense' ? 'active-expense' : 'active-income');
    }
  });
  renderCategoryOptions();
}

function renderCategoryOptions() {
  $category.innerHTML = CATEGORIES[currentType]
    .map(c => `<option value="${c}">${c}</option>`).join('');
}

/* ============ 增删 ============ */
function addRecord() {
  const amount = parseFloat($amount.value);
  if (!amount || isNaN(amount) || amount <= 0) {
    alert('请输入有效的金额（大于0）');
    $amount.focus();
    return;
  }
  const record = {
    id: Date.now(),
    type: currentType,
    amount: Math.round(amount * 100) / 100,
    category: $category.value,
    note: $note.value.trim(),
    date: $date.value || new Date().toISOString().slice(0, 10)
  };
  records.push(record);
  saveRecords();

  $amount.value = '';
  $note.value = '';
  $amount.focus();
  render();
}

function deleteRecord(id) {
  if (!confirm('确定删除这条记录吗？')) return;
  records = records.filter(r => r.id !== id);
  saveRecords();
  render();
}

/* ============ 渲染 ============ */
function getFilteredRecords() {
  const month = $monthFilter.value; // "2026-11"
  if (!month) return records;
  return records.filter(r => r.date.startsWith(month));
}

function render() {
  const filtered = getFilteredRecords();
  renderStats(filtered);
  renderList(filtered);
  renderChart(filtered);
}

function renderStats(list) {
  const income = list.filter(r => r.type === 'income')
    .reduce((s, r) => s + r.amount, 0);
  const expense = list.filter(r => r.type === 'expense')
    .reduce((s, r) => s + r.amount, 0);
  const balance = income - expense;

  $totalIncome.textContent = '¥' + income.toFixed(2);
  $totalExpense.textContent = '¥' + expense.toFixed(2);
  $balance.textContent = '¥' + balance.toFixed(2);
  $balance.className = 'value ' + (balance >= 0 ? 'income-text' : 'expense-text');
}

function renderList(list) {
  if (list.length === 0) {
    $list.innerHTML = '<div class="empty">暂无记录，先添加一笔吧～</div>';
    return;
  }
  const sorted = [...list].sort((a, b) =>
    b.date.localeCompare(a.date) || b.id - a.id
  );
  $list.innerHTML = sorted.map(r => {
    const sign = r.type === 'income' ? '+' : '-';
    const cls = r.type === 'income' ? 'income-text' : 'expense-text';
    return `
      <div class="record">
        <div class="record-info">
          <div class="record-top">
            <span class="record-category">${r.category}</span>
            ${r.note ? `<span class="record-note">${escapeHtml(r.note)}</span>` : ''}
          </div>
          <div class="record-date">${r.date}</div>
        </div>
        <div class="record-amount ${cls}">${sign}¥${r.amount.toFixed(2)}</div>
        <button class="btn-del" data-id="${r.id}" title="删除">✕</button>
      </div>
    `;
  }).join('');

  $list.querySelectorAll('.btn-del').forEach(btn => {
    btn.addEventListener('click', () => deleteRecord(Number(btn.dataset.id)));
  });
}

function renderChart(list) {
  const expenses = list.filter(r => r.type === 'expense');
  const map = {};
  expenses.forEach(r => {
    map[r.category] = (map[r.category] || 0) + r.amount;
  });
  const labels = Object.keys(map);
  const data = Object.values(map);

  if (pieChart) pieChart.destroy();

  if (labels.length === 0) {
    const ctx = document.getElementById('pieChart').getContext('2d');
    ctx.clearRect(0, 0, 400, 200);
    return;
  }

  const colors = ['#4a7fe0', '#e04a4a', '#f0a020', '#1a9e5c',
                  '#9b59b6', '#16a085', '#e67e22', '#7f8c8d'];
  const ctx = document.getElementById('pieChart').getContext('2d');
  pieChart = new Chart(ctx, {
    type: 'doughnut',
    data: {
      labels,
      datasets: [{
        data,
        backgroundColor: colors.slice(0, labels.length)
      }]
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      plugins: {
        legend: { position: 'right', labels: { boxWidth: 12, font: { size: 12 } } }
      }
    }
  });
}

/* ============ 工具 ============ */
function escapeHtml(str) {
  return str.replace(/[&<>"']/g, m => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
  }[m]));
}

init();
</script>
</body>
</html>
